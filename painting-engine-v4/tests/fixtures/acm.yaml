layout: ACM DISTRIBUIDORA
fonte: ficha
faces:
  lateral:
    arquivo: "ACM 8,30m lateral.png"
    escala_mm_px: {valor: 0.8406, tol_pct: 1}   # largura DECLARADA 8,30 m
    painel_mm: {w: 8300, h: 2532, tol_pct: 1}
    campo: {classe: CHAPA, hex: "#FFFFFF"}
    pintura_geral: false
    n_dias: 1   # R2-4: calendário por regra (dono, 21/08)
    render: VETORIAL_CHAPADO   # 14 cores exatas cobrem 98,2% — semear pelas exatas, NUNCA histograma
    n_tintas: {valor: 12, tol: 1}   # 14 cores − fusões (#276540≈#1A623F ΔE 2,66 mesma tinta)
    tinta_m2_total: {valor: 11.33, tol_pct: 10}   # primeiro layout onde tinta > campo
    fronteira_tt_m: {valor: 69.9, tol_pct: 12}    # 66,8 mosaico + 3,1 logo + 0 texto
    mosaico: {triangulos: 117, cores: 11, lado_mm: 422}
    degrades_n: {valor: 1, tol: 1}   # a sombra pode fatiar em 2 famílias (parte chapada #2A4F37 + rampa)
    degrades:
      - {onde: sombra do logotipo, de: verde-escuro, para: verde, tons_sugeridos: 2}  # 1082 cores, contorno duro 1px contra a elipse
    aerografias_n: 0
    ilhas_de_graca_n: {valor: 15, tol: 3}   # letras ACM + ilhas, 0,138 m²
    adesivos_n: {valor: 3, tol: 1}   # 2 mosaicos + logo+texto (agrupar = pergunta: vão 161 mm = 1,3× altura)
    fusoes_candidatas:
      - {par: ["#C4E4CF", "#D1EAD9"], delta_e: 4.3, ganho: "1 ciclo + 3,48 m de corte"}
    notas: >
      Texto 2 581×126 mm com ZERO fronteira — pousa só no campo. 12 ciclos na
      lateral (11 se fundir os claros). Fronteira: reportar metro ABSOLUTO e
      m/m² (69,9 m > 38,3 m do 137 embora a densidade seja menor).
  traseira:
    arquivo: "ACM 8,30m traseira.png"
    campo: {classe: CHAPA, hex: "#FFFFFF"}
    pintura_geral: false
    render: VETORIAL_CHAPADO   # 12 cores exatas cobrem 99,1%
    painel_mm: {w: 2532, h: 2532, tol_pct: 4}   # sem medida declarada — altura assumida da lateral (pergunta)
    hexes_transferiveis: true   # as 12 cores da traseira existem HEX A HEX na lateral
    tinta_m2_total: {valor: 2.58, tol_pct: 12}
    fronteira_tt_m: {valor: 28.5, tol_pct: 12}
    mosaico: {triangulos: 90, escala_vs_lateral: 0.5}
    adesivos_n: {valor: 3, tol: 1}
    defeitos:
      - elipse do logo #276540 (lateral) × #177548 (traseira), ΔE 10,1 — e #177548 é cor do mosaico
      - sombra do logo: degradê na lateral × chapada #2A4F37 na traseira (o cliente entregou a versão achatada)
