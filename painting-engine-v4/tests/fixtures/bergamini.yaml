      - "Só uma face fornecida — existe traseira (recomposição) a analisar?"
notas_gerais: "Render vetorial chapado (n98=3). Duas tintas que nunca se tocam (filetes brancos de campo em toda vizinhança letreiro×listras) — verde e vermelho pintam na mesma rodada, zero corte à mão, zero ciclo extra. A banda de listras é o maior volume de tinta (27% da área); listras retas, não candidatas a fita orgânica."
