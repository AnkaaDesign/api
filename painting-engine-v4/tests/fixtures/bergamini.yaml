        pousa_sobre: CAMPO
        toca_tinta: false
        notas: "BERGAMINI@BERGAMINIFRUTAS.COM / FONE: 3028-5203 / 3025-1433."
      - nome: texto-site-endereco
        tipo: TEXTO
        tecnica: CHAPADA
        cores: [verde-escuro]
        pousa_sobre: CAMPO
        toca_tinta: false
        notas: "WWW.BERGAMINIFRUTAS.COM / AV. JK 1254 - CEASA - BOX: 307/309/311/313/314 - FOZ DO IGUAÇU-PR. Linha menor do painel (~100 mm de altura), ainda confortável."
